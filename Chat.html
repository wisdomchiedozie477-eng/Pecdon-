<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Modern Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #18181b;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    /* Chat Header */
    .chat-header {
      padding: 16px 20px;
      background: #202024;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d2d32;
    }

    .header-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      cursor: pointer;
    }

    .profile-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #2d2d32;
      border: 2px solid #00b4d8;
    }

    .avatar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .profile-avatar-wrapper:hover .avatar-overlay {
      opacity: 1;
    }

    .avatar-overlay svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    #profile-file-input {
      display: none;
    }

    .user-details h2 {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .user-details span {
      font-size: 12px;
      color: #10b981;
    }

    /* Chat Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.received {
      background: #27272a;
      color: #f4f4f5;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.sent {
      background: #00b4d8;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    /* Chat Input Bar */
    .chat-bar {
      padding: 14px 16px;
      background: #202024;
      border-top: 1px solid #2d2d32;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #message-input {
      flex: 1;
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 24px;
      padding: 12px 18px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #message-input:focus {
      border-color: #00b4d8;
    }

    #send-btn {
      background: #00b4d8;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #send-btn:hover {
      background: #0077b6;
    }

    #send-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header with Clickable Profile Picture -->
    <div class="chat-header">
      <div class="header-user-info">
        <label for="profile-file-input" class="profile-avatar-wrapper" title="Click to upload chat profile picture">
          <img id="avatar-preview" class="profile-avatar-img" src="https://via.placeholder.com/150" alt="Profile Picture">
          <div class="avatar-overlay">
            <svg viewBox="0 0 24 24"><path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
          </div>
        </label>
        <input type="file" id="profile-file-input" accept="image/*">
        <div class="user-details">
          <h2>Alex Johnson</h2>
          <span>Online</span>
        </div>
      </div>
    </div>

    <!-- Messages List -->
    <div id="chat-messages" class="chat-messages">
      <div class="message received">
        Hey, are we still meeting today?
      </div>
      <div class="message sent">
        Yes, let's talk at 3 PM.
      </div>
      <div class="message received">
        Perfect, see you then!
      </div>
    </div>

    <!-- Chat Input Bar -->
    <div class="chat-bar">
      <input type="text" id="message-input" placeholder="Type a message...">
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // Handle image file selection and live preview for chat profile
    const fileInput = document.getElementById('profile-file-input');
    const avatarPreview = document.getElementById('avatar-preview');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          avatarPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle sending messages
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const chatMessages = document.getElementById('chat-messages');

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text !== '') {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', 'sent');
        messageDiv.textContent = text;
        chatMessages.appendChild(messageDiv);
        messageInput.value = '';
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>

</body>
  </html>
