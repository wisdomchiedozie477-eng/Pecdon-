<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0a0a0c; color: #ffffff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; }
    
    .settings-container { width: 100%; max-width: 500px; }
    
    h2 { font-size: 28px; margin-bottom: 24px; font-weight: 700; }
    
    .settings-section { background-color: #18181b; border-radius: 24px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
    
    .section-title { color: #a1a1aa; font-size: 14px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #27272a; }
    .setting-item:last-child { border-bottom: none; }
    
    .setting-info { display: flex; flex-direction: column; }
    .setting-label { font-size: 16px; font-weight: 500; }
    .setting-desc { font-size: 12px; color: #a1a1aa; margin-top: 4px; }
    
    .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #27272a; transition: .4s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: #ffffff; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>

  <div class="settings-container">
    <h2>Settings</h2>
    
    <div class="settings-section">
      <div class="section-title">Account</div>
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-label">Notifications</span>
          <span class="setting-desc">Enable push alerts for messages.</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-label">Dark Mode</span>
          <span class="setting-desc">Keep the app in dark theme.</span>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <div class="settings-section">
      <div class="section-title">Privacy</div>
      <div class="setting-item">
        <div class="setting-info">
          <span class="setting-label">Profile Visibility</span>
          <span class="setting-desc">Allow others to find your profile.</span>
        </div>
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
